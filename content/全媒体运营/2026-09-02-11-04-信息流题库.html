<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息流优化 · 题库（精美版）</title>
<style>
:root{
  --bg1:#0f1226; --bg2:#1a1f3d; --card:rgba(255,255,255,.06);
  --card-b:rgba(255,255,255,.12); --txt:#eef1ff; --sub:#9aa3c7;
  --accent:#7c8cff; --accent2:#ff7cb1; --modal-bg:rgba(22,26,52,.92);
  --glass:blur(14px); --radius:22px; --shadow:0 12px 40px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg1:#f3f5ff; --bg2:#e8ecff; --card:#ffffff; --card-b:#dfe4ff;
  --txt:#1d2340; --sub:#6b7396; --modal-bg:rgba(255,255,255,.96);
  --shadow:0 12px 40px rgba(80,90,180,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh;color:var(--txt);overflow-x:hidden;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;
}
body::before{width:420px;height:420px;background:rgba(124,140,255,.25);top:-120px;left:-100px}
body::after{width:380px;height:380px;background:rgba(255,124,177,.2);bottom:-100px;right:-80px}

header{position:relative;z-index:2;text-align:center;padding:44px 16px 10px}
header .logo{font-size:52px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
header h1{font-size:clamp(24px,4vw,38px);letter-spacing:2px;margin:8px 0 6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--sub);font-size:14px}
#themeBtn{position:fixed;top:18px;right:18px;z-index:50;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--card-b);background:var(--card);backdrop-filter:var(--glass);
  color:var(--txt);font-size:22px;cursor:pointer;transition:.3s}
#themeBtn:hover{transform:rotate(20deg) scale(1.1)}

.grid{
  position:relative;z-index:2;max-width:1200px;margin:34px auto 60px;padding:0 22px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;
}
.card{
  background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);
  padding:26px 18px 20px;text-align:center;cursor:pointer;backdrop-filter:var(--glass);
  transition:.35s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;
  animation:pop .5s backwards;
}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:.35s;
  background:radial-gradient(300px circle at 50% 0%,var(--glow),transparent 70%)}
.card:hover{transform:translateY(-8px) scale(1.03);box-shadow:var(--shadow);border-color:var(--glow)}
.card:hover::before{opacity:.5}
.card .num{position:absolute;top:10px;left:14px;font-size:12px;color:var(--sub);letter-spacing:1px}
.card .ico{
  font-size:60px;line-height:1;display:inline-block;margin-bottom:14px;
  width:96px;height:96px;line-height:96px;border-radius:28px;
  background:var(--glow);filter:grayscale(0);
  transition:.35s;box-shadow:0 8px 22px rgba(0,0,0,.25);
}
.card:hover .ico{transform:scale(1.12) rotate(-6deg)}
.card h3{font-size:18px;margin-bottom:6px}
.card .tag{display:inline-block;font-size:12px;color:var(--sub);
  border:1px solid var(--card-b);border-radius:20px;padding:3px 12px}

/* ===== 统一弹窗 ===== */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(8,10,24,.6);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  /* ★ 统一大小：所有弹窗一致，内容内部滚动 */
  width:min(920px,94vw);height:min(86vh,780px);
  background:var(--modal-bg);backdrop-filter:var(--glass);
  border:1px solid var(--card-b);border-radius:26px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:zoom .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes zoom{from{transform:scale(.92) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.m-head{
  flex:none;display:flex;align-items:center;gap:16px;padding:20px 26px;
  border-bottom:1px solid var(--card-b);background:var(--glow);
}
.m-head .ico{font-size:44px;width:70px;height:70px;line-height:70px;text-align:center;
  border-radius:20px;background:rgba(255,255,255,.1);flex:none}
.m-head h2{font-size:22px}
.m-head .m-sub{color:var(--sub);font-size:13px;margin-top:3px}
.m-close{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--card-b);background:transparent;color:var(--txt);
  font-size:18px;cursor:pointer;transition:.25s}
.m-close:hover{background:var(--accent2);color:#fff;transform:rotate(90deg)}
.m-body{flex:1;overflow-y:auto;padding:24px 28px 30px}
.m-body::-webkit-scrollbar{width:8px}
.m-body::-webkit-scrollbar-thumb{background:var(--card-b);border-radius:8px}
.m-foot{flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:12px 26px;border-top:1px solid var(--card-b);color:var(--sub);font-size:13px}
.m-foot button{border:1px solid var(--card-b);background:transparent;color:var(--txt);
  padding:8px 18px;border-radius:12px;cursor:pointer;transition:.25s}
.m-foot button:hover{background:var(--accent);color:#fff}

/* 弹窗内容模块 */
.sec{margin-bottom:26px}
.sec>h4{font-size:16px;margin-bottom:12px;padding-left:12px;border-left:4px solid var(--accent);
  display:flex;align-items:center;gap:8px}
.box{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:16px 18px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;text-align:center}
.vs .side{padding:16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--card-b)}
.vs .side.good{border-color:#4ade80aa;background:rgba(74,222,128,.08)}
.vs .side.bad{border-color:#f87171aa;background:rgba(248,113,113,.08)}
.vs .side b{font-size:17px;display:block;margin-bottom:4px}
.vs .side span{font-size:13px;color:var(--sub)}
.vs .mid{font-size:22px;font-weight:700;color:var(--sub)}
.formula{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;
  font-size:17px;font-weight:600;padding:18px;text-align:center}
.formula .f-item{background:rgba(255,255,255,.07);border:1px solid var(--card-b);
  border-radius:12px;padding:10px 16px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center}
.flow .step{background:rgba(255,255,255,.07);border:1px solid var(--card-b);border-radius:12px;
  padding:10px 16px;text-align:center;font-size:14px}
.flow .step small{display:block;color:var(--sub);font-size:11px;margin-top:3px}
.flow .arr{color:var(--accent);font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--card-b)}
th{color:var(--accent);font-size:13px;letter-spacing:1px}
tr:hover td{background:rgba(255,255,255,.04)}
ul.points{list-style:none}
ul.points li{padding:8px 0 8px 26px;position:relative;font-size:14px;line-height:1.7}
ul.points li::before{content:"▸";position:absolute;left:6px;color:var(--accent2);font-weight:700}
.recite{
  margin-top:6px;border-radius:16px;padding:18px 20px;line-height:1.9;font-size:14.5px;
  background:linear-gradient(135deg,rgba(124,140,255,.15),rgba(255,124,177,.12));
  border:1px dashed var(--accent);
}
.recite b{color:var(--accent2)}
.recite .rt{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tip{font-size:13px;color:var(--sub);margin-top:10px;padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.04);border-left:3px solid var(--accent2)}
@media(max-width:560px){
  .card .ico{width:80px;height:80px;line-height:80px;font-size:48px}
  .m-body{padding:16px}
  .vs{grid-template-columns:1fr}
  .vs .mid{transform:rotate(90deg)}
}
</style>
</head>
<body>

<button id="themeBtn" title="切换主题">🌙</button>

<header>
  <div class="logo">📈</div>
  <h1>信息流优化 · 题库</h1>
  <p>可视化 · 10 题 · 👆 点击卡片查看详细解析</p>
</header>

<main class="grid" id="grid"></main>

<!-- ★ 统一弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-head" id="mHead"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-foot">
      <button id="prevBtn">‹ 上一题</button>
      <span id="mIndex"></span>
      <button id="nextBtn">下一题 ›</button>
    </div>
  </div>
</div>

<script>
/* ================= 数据（详细版） ================= */
const TOPICS=[
{n:1,ico:"📉",title:"降成本",tag:"不靠提价",glow:"linear-gradient(135deg,#3b5bff44,#7c8cff33)",body:`
<div class="sec"><h4>⚖️ 对比：提价 vs 优化</h4>
<div class="vs">
  <div class="side bad"><b>❌ 提价</b><span>量↓ · 成本反而↑ · 下策</span></div>
  <div class="mid">VS</div>
  <div class="side good"><b>✅ 优化</b><span>钱花在刀刃上 · 上策</span></div>
</div></div>
<div class="sec"><h4>💡 本质公式</h4>
<div class="box formula"><span class="f-item">💸 花费</span>÷<span class="f-item">🎯 转化人数</span>=<span class="f-item">💰 成本</span></div>
<p class="tip">两条路：① 砍掉无效消耗 ② 让同样预算转化更多人</p></div>
<div class="sec"><h4>🔪 五把刀（详细动作）</h4>
<div class="box"><table>
<tr><th>抓手</th><th>具体怎么做</th></tr>
<tr><td>🎯 找对人</td><td>看历史数据锁定高转化人群/地域/时段；排除已转化人群；屏蔽无效兴趣包、竞品词、异常设备</td></tr>
<tr><td>🎬 说对话</td><td>A/B 测试赛马；点击率跌破阈值立刻换新；卖点必须对齐用户痛点</td></tr>
<tr><td>📄 接得住</td><td>落地页与广告承诺一致；表单能短就短（少一个字段转化可能翻倍）；加载速度控制</td></tr>
<tr><td>✂️ 砍得准</td><td>70% 时间花在砍计划/调预算而非调出价；亏钱果断关，赚钱大胆加；按漏斗补短板</td></tr>
<tr><td>🤖 用对器</td><td>优先 ocpm/ocpc 智能出价；学习期前不乱动；冲量用放量、控本用控本，不混用</td></tr>
<tr><td>🧮 算总账</td><td>提客单价（套餐/加购）摊薄获客成本；私域承接复购转介绍；算清 LTV 才敢放量</td></tr>
</table></div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
降成本的核心不是「少花钱」，而是「把每一分钱花在刀刃上」：<b>定向找对人、素材说对话、落地页接得住、数据砍得准、后端算总账</b>——提价只是下策，优化「人货场」匹配度才是上策。</div></div>`},

{n:2,ico:"🧭",title:"素材走向",tag:"五看一机制",glow:"linear-gradient(135deg,#00c9a744,#4dd0e133)",body:`
<div class="sec"><h4>👀 五看 · 详细动作</h4>
<div class="box"><table>
<tr><th>方向</th><th>看什么</th><th>工具/方法</th></tr>
<tr><td>📊 看数据</td><td>跑量素材共同基因（开头/时长/风格）；素材生命周期天数</td><td>账户报表、CTR/CVR 走势</td></tr>
<tr><td>🔍 看同行</td><td>竞品在测什么形式/卖点/场景；素材存活时长</td><td>巨量创意、App Growing、ADBUG</td></tr>
<tr><td>🏢 看平台</td><td>新素材形式、新工具、官方案例白皮书</td><td>早用早吃红利</td></tr>
<tr><td>👥 看用户</td><td>评论区/私信高频问题=下个选题；搜索词报告；画像变化</td><td>方向在用户嘴里</td></tr>
<tr><td>🔥 看热点</td><td>节日/行业大事件/热榜提前预案</td><td>当天出当天测，过时即废</td></tr>
</table></div></div>
<div class="sec"><h4>🤖 AI 提产能</h4>
<div class="box formula"><span class="f-item">📦 一周测 10 条</span>→<span class="f-item">🤖 一天测 10 条</span><span class="f-item" style="color:#4ade80">爆款概率 ×7</span></div>
<p class="tip">用 AIGC 批量产出脚本/文案/数字人口播，把「测素材」成本打下来。</p></div>
<div class="sec"><h4>♻️ 一机制 · 素材生命周期</h4>
<div class="box flow">
<span class="step">📦 储备<small>提前备·蹭节点</small></span><span class="arr">→</span>
<span class="step">🧪 测试<small>小预算赛马</small></span><span class="arr">→</span>
<span class="step">🚀 起量<small>加预算</small></span><span class="arr">→</span>
<span class="step">📉 衰退<small>跌破阈值</small></span><span class="arr">→</span>
<span class="step">🔄 迭代/淘汰<small>改版或换新</small></span><span class="arr">↺</span>
</div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
核心是「<b>五看一机制</b>」：看数据、看同行、看平台、看用户、看热点 + AI 提产能，靠「储备—测试—起量—迭代」机制跑起来。<b>不赌爆款，只提高爆款出现的概率</b>。</div></div>`},

{n:3,ico:"🖼️",title:"图文争流",tag:"错位竞争",glow:"linear-gradient(135deg,#ffb02044,#ff7cb133)",body:`
<div class="sec"><h4>⚔️ 战场对比</h4>
<div class="vs">
  <div class="side bad"><b>🎬 视频</b><span>红海 · 卷 · 贵 · 周期长</span></div>
  <div class="mid">VS</div>
  <div class="side good"><b>🖼️ 图文</b><span>蓝海 · 便宜 · 快 · 有扶持</span></div>
</div></div>
<div class="sec"><h4>📸 图片四招</h4>
<div class="box"><table>
<tr><th>招式</th><th>要点</th></tr>
<tr><td>截图复用</td><td>视频高光帧转图片，一次拍摄两种形态，双份流量</td></tr>
<tr><td>🔤 大字报</td><td>一屏说透价格/优惠/痛点/行动指令，1-2 秒内一眼看懂</td></tr>
<tr><td>🎞️ 动图化</td><td>GIF、轮播、动态封面，接近视频观感</td></tr>
<tr><td>✅ 真实感</td><td>实拍/业主截图/前后对比——视频可摆拍，截图更可信</td></tr>
</table></div></div>
<div class="sec"><h4>💬 文案三阵地</h4>
<div class="box"><ul class="points">
<li><b>评论区</b>：小号带节奏，神评论比视频本身更抓人</li>
<li><b>搜索词</b>：标题/话题埋关键词，搜索场景下文案就是门面</li>
<li><b>图文扶持</b>：抖音图文/小红书笔记有流量倾斜，制作成本≈0</li>
</ul>
<p class="tip">短文案三秒钩子示例：「装修最坑的不是贵，是你不知道贵在哪」——标题党要克制，过头掉信任。</p></div></div>
<div class="sec"><h4>♟️ 打法：侦察兵策略</h4>
<div class="box flow"><span class="step">🖼️ 图片侦察<small>便宜 · 当天测几十张</small></span><span class="arr">→</span><span class="step">测通方向<small>卖点/人群验证</small></span><span class="arr">→</span><span class="step">🎬 视频收割<small>放大投入</small></span></div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
图片文案是<b>错位竞争的便宜武器</b>：截图复用、大字报、动图化提高密度；评论区/搜索/图文吃扶持；用图片做「侦察兵」低成本测方向。<b>视频负责收割，图片文案负责侦察和捡漏</b>。</div></div>`},

{n:4,ico:"🩺",title:"掉量处理",tag:"先诊后药",glow:"linear-gradient(135deg,#ff5c7a44,#ff9a5c33)",body:`
<div class="sec"><h4>💡 本质 · ECPM 公式</h4>
<div class="box formula"><span class="f-item">🏷️ 出价</span>×<span class="f-item">👆 预估CTR</span>×<span class="f-item">🎯 预估CVR</span>=<span class="f-item">🏆 竞争力</span></div>
<p class="tip">三者任一崩了计划就掉量——先诊断，别急着动手。</p></div>
<div class="sec"><h4>🔍 第一步 · 分清谁掉了</h4>
<div class="box"><table>
<tr><th>类型</th><th>判断方法</th><th>原因方向</th></tr>
<tr><td>🌍 大盘掉量</td><td>同行业所有计划都掉</td><td>流量波动/淡旺季/竞价激烈 → 等回暖</td></tr>
<tr><td>🏠 账户掉量</td><td>就你账户整体掉</td><td>余额不足/违规限流/负向操作过多</td></tr>
<tr><td>📋 单计划掉量</td><td>其他正常就它掉</td><td>素材衰退/出价低/人群枯竭/学习失败</td></tr>
</table></div></div>
<div class="sec"><h4>💊 第二步 · 六大原因对症下药</h4>
<div class="box"><table>
<tr><th>病因</th><th>表现</th><th>处方</th></tr>
<tr><td>🎬 素材衰退（最常见）</td><td>CTR 持续下滑</td><td>换新/改开头/翻新迭代</td></tr>
<tr><td>🏷️ 出价不足</td><td>曝光少但 CTR 正常</td><td>小步提价 5%-10%，错峰投放</td></tr>
<tr><td>💰 预算撞线</td><td>到线就停</td><td>加预算，查是否被挤占</td></tr>
<tr><td>👥 人群跑完</td><td>曝光越来越少</td><td>放宽定向/兴趣扩展/重新圈人</td></tr>
<tr><td>🧪 学习期失败</td><td>新计划被压制</td><td>稳住别乱动，或换素材重起</td></tr>
<tr><td>🏠 账户层问题</td><td>整体断崖</td><td>查余额/违规通知，减少负向操作</td></tr>
</table></div></div>
<div class="sec"><h4>🚑 分级处理 SOP</h4>
<div class="box flow">
<span class="step">轻症<small>+5-10%价 · 上新素材</small></span><span class="arr">→</span>
<span class="step">中症<small>换素材 · 宽定向 · 重起新计划</small></span><span class="arr">→</span>
<span class="step">重症<small>查账户 · 关停重开 · 等大盘</small></span>
</div>
<p class="tip">🚫 两条红线：一次只动一个变量；别死守烂计划——新计划永远是最好的解药。</p></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
处理掉量核心是「<b>先诊断，后用药</b>」：先分清大盘/账户/单计划，再看 ECPM 三要素哪个崩了——CTR 崩换素材、出价不够小步提、人群跑完宽定向。<b>一次只动一个变量，轻症调理、重症换新</b>。</div></div>`},

{n:5,ico:"📆",title:"次日异常",tag:"稳住别慌",glow:"linear-gradient(135deg,#8a63ff44,#b388ff33)",body:`
<div class="sec"><h4>🔄 先理解常态</h4>
<div class="box flow">
<span class="step">D1 🚀 扶持量<small>平台新户试用期流量</small></span><span class="arr">→</span>
<span class="step">D2 📉 回归<small>真实竞争力 · <b style="color:#4ade80">常态 ≠ 出问题</b></small></span>
</div></div>
<div class="sec"><h4>🔎 四查 · 按优先级</h4>
<div class="box"><table>
<tr><th>#</th><th>查什么</th><th>为什么</th></tr>
<tr><td>1</td><td>📡 转化回传（最重要）</td><td>回传一断模型就"瞎了"，跑量必然异常——最容易被忽略的隐形杀手</td></tr>
<tr><td>2</td><td>🖐️ 操作记录</td><td>有人动过计划？频繁暂停/开启是断崖掉量头号人为原因</td></tr>
<tr><td>3</td><td>🌍 对比大盘</td><td>全行业都掉 = 大盘问题，跟你无关，稳住等回暖</td></tr>
<tr><td>4</td><td>💳 预算</td><td>是否撞线、被其他计划挤占</td></tr>
</table></div></div>
<div class="sec"><h4>💊 四种情况对症</h4>
<div class="box"><table>
<tr><th>情况</th><th>判断</th><th>对策</th></tr>
<tr><td>量回落·成本正常</td><td>扶持流量结束（最常见）</td><td>稳住观察 1-2 天，备好新素材接替</td></tr>
<tr><td>成本异常高</td><td>学习期探索拉高出价</td><td>给模型 1-2 天，持续异常再小步调</td></tr>
<tr><td>CTR 骤降</td><td>素材疲劳/被过滤</td><td>换新素材、轮换创意</td></tr>
<tr><td>回传异常</td><td>埋点/API 断了</td><td>先修代码，模型会自己缓过来</td></tr>
</table></div>
<p class="tip">⏳ 红线：学习期（一般 3-5 天）能不操作就不操作——今天调明天动，计划永远学不会。</p></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
先确认异常类型，再按序查<b>回传→操作→大盘→预算</b>；学习期稳住不动，观察 1-2 天。<b>先排查外部因素，最后才动计划本身</b>。</div></div>`},

{n:6,ico:"🕳️",title:"不起量",tag:"三层漏斗",glow:"linear-gradient(135deg,#00b8d444,#64ffda33)",body:`
<div class="sec"><h4>🔻 三层漏斗排查框架</h4>
<div class="box flow">
<span class="step">🚪 第一层 · 投出去<small>审核 · 资质 · 余额</small></span><span class="arr">→</span>
<span class="step">👁️ 第二层 · 有曝光<small>出价 · 定向 · CTR</small></span><span class="arr">→</span>
<span class="step">🎯 第三层 · 接得住<small>落地页 · 回传</small></span>
</div><p class="tip">哪一层卡住，量就起不来——按漏斗顺序逐层排查。</p></div>
<div class="sec"><h4>📋 12 个原因 · 全景清单</h4>
<div class="box"><table>
<tr><th>层</th><th>原因</th><th>对策</th></tr>
<tr><td rowspan="3">🚪 投出去</td><td>资质/审核没过</td><td>查拒审原因，改完重提</td></tr>
<tr><td>余额不足（最low的坑）</td><td>充值，保证 3-5 天学习期预算</td></tr>
<tr><td>账户被风控/限流</td><td>联系运营排查账户状态</td></tr>
<tr><td rowspan="4">👁️ 有曝光</td><td>⭐ 出价太低（最常见）</td><td>参考行业均价上浮 10-20%，跑出数据再降</td></tr>
<tr><td>⭐ 定向太窄</td><td>先宽后窄，放开跑数据再收窄</td></tr>
<tr><td>预算太低</td><td>给足探索空间</td></tr>
<tr><td>素材 CTR 太低</td><td>5-10 条素材赛马</td></tr>
<tr><td rowspan="3">🎯 接得住</td><td>⭐ 转化目标太深（新手最爱犯）</td><td>先浅后深：先表单/加粉积累数据</td></tr>
<tr><td>回传没接好</td><td>回传是模型的"眼睛"，务必检查</td></tr>
<tr><td>落地页太差</td><td>保证「广告说的 = 落地页给的」</td></tr>
<tr><td rowspan="2">隐藏</td><td>计划同质化互抢量</td><td>素材/定向差异化</td></tr>
<tr><td>冷启动需要时间</td><td>给时间+给预算+稳住别折腾</td></tr>
</table></div></div>
<div class="sec"><h4>🪓 起量三板斧</h4>
<div class="box formula"><span class="f-item">🏷️ 出价 ↑10-20%</span><span class="f-item">👥 定向先宽</span><span class="f-item">🎬 素材 ×5-10 赛马</span></div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
用「<b>三层漏斗</b>」排查：投不投得出去→有没有曝光→转化接不接得住；对应三板斧：<b>出价给足、定向放宽、素材备足</b>；转化目标先浅后深，回传接好，冷启动稳住别折腾。</div></div>`},

{n:7,ico:"🔄",title:"账户优化",tag:"六大+一循环",glow:"linear-gradient(135deg,#26a69a44,#80cbc433)",body:`
<div class="sec"><h4>💡 本质</h4><p class="tip">账户优化 = <b>「人货场」的持续匹配</b>：让人群、素材、链路不断逼近最优组合。</p></div>
<div class="sec"><h4>🛠️ 六大优化途径</h4>
<div class="box"><table>
<tr><th>维度</th><th>核心动作</th></tr>
<tr><td>🏗️ 结构</td><td>层级分明命名规范；计划按目的分层（起量/维稳/收割）；避免同质化内耗</td></tr>
<tr><td>🎯 定向</td><td>先宽后窄；人群包赛马；排除已转化；结合时段/地域数据优化</td></tr>
<tr><td>💰 出价预算</td><td>优先智能出价；预算跟着数据走；高峰抢量低谷控本；新计划给足过学习期</td></tr>
<tr><td>🎬 素材</td><td>5-10 条赛马；生命周期管理；跌破阈值换新；形式多元化</td></tr>
<tr><td>🔗 链路</td><td>落地页快/一致/表单短；转化目标先浅后深；回传必须准确</td></tr>
<tr><td>📈 数据</td><td>盯 CTR/CVR/CPA/ROI；看漏斗补短板；日报周报复盘，数据驱动</td></tr>
</table></div></div>
<div class="sec"><h4>♻️ PDCA 循环（方法论核心）</h4>
<div class="box flow">
<span class="step">🧪 测试<small>小步快测</small></span><span class="arr">→</span>
<span class="step">📊 数据<small>看结果</small></span><span class="arr">→</span>
<span class="step">🔄 迭代<small>留优汰劣</small></span><span class="arr">→</span>
<span class="step">▶ 再测试<small>持续循环</small></span><span class="arr">↺</span>
</div><p class="tip">🚫 一次只动一个变量，数据说话，绝不拍脑袋。</p></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
六大途径：<b>结构搭骨架、定向找对人、出价预算花对钱、素材说对话、链路接得住、数据看得清</b>；一切靠 PDCA：小步快测、数据说话、一次一变量、持续迭代。</div></div>`},

{n:8,ico:"🏗️",title:"搭户思路",tag:"分层三原则",glow:"linear-gradient(135deg,#7e57c244,#ce93d833)",body:`
<div class="sec"><h4>💡 本质</h4><p class="tip">搭建的核心不是「建多少计划」，而是「<b>跑出什么数据</b>」——围绕高效测试+方便复盘。</p></div>
<div class="sec"><h4>🎯 五维分层</h4>
<div class="box"><table>
<tr><th>维度</th><th>拆法</th></tr>
<tr><td>① 按目的（最常用）</td><td>🚀 起量（宽定向·足预算·放量）/ ⚖️ 维稳（成熟素材·控成本）/ 🌾 收割（窄定向·高意向·深目标）</td></tr>
<tr><td>② 按人群</td><td>宽 vs 窄；新客 vs 老客；相似人群 lookalike 扩量</td></tr>
<tr><td>③ 按素材/卖点</td><td>形式分开；<b>一个卖点一个计划</b>（价格款/品质款/故事款/场景款）</td></tr>
<tr><td>④ 按业务/地域</td><td>产品线分开测；本地生活按城市分开建</td></tr>
<tr><td>⑤ 按出价/预算</td><td>放量 vs 控成本；高预算测试 vs 低预算验证</td></tr>
</table></div></div>
<div class="sec"><h4>📜 三大原则（加分项）</h4>
<div class="box"><ul class="points">
<li><b>控制变量法</b>：测素材就只换素材，变量混着变数据就是糊涂账</li>
<li><b>计划间差异化</b>：素材/定向/出价至少一个维度不同，一模一样=自己人抢自己人</li>
<li><b>命名规范</b>：目的+人群+素材+日期（如「起量-女性25-35-价格款-0312」），复盘 3 秒看懂</li>
</ul></div></div>
<div class="sec"><h4>🪜 搭建 SOP 五步</h4>
<div class="box flow">
<span class="step">🎯 定目标<small>获客/成交/预算</small></span><span class="arr">→</span>
<span class="step">👥 定人群<small>画像/地域/时段</small></span><span class="arr">→</span>
<span class="step">💎 定卖点<small>选 2-3 个主打</small></span><span class="arr">→</span>
<span class="step">🏗️ 搭结构<small>分层+多素材</small></span><span class="arr">→</span>
<span class="step">🧪 上线测试<small>复盘迭代 ↺</small></span>
</div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
核心是<b>测试思维</b>：五大分层（目的/人群/素材/业务/出价）+ 三原则（单变量、差异化、命名规范）+ 五步 SOP：<b>定目标→定人群→定卖点→搭结构→上线复盘迭代</b>。</div></div>`},

{n:9,ico:"⚖️",title:"性别占比",tag:"加菜不撤菜",glow:"linear-gradient(135deg,#ec407a44,#f48fb133)",body:`
<div class="sec"><h4>💡 为什么男性占比大</h4>
<p class="tip">起量期系统还没学明白「谁转化好」，先跑「容易点击消耗」的人群——<b>正常现象，不是账户坏了</b>。核心矛盾：流量 vs 人群结构，要求不影响流量 → 只能用<b>加法</b>。</p></div>
<div class="sec"><h4>⚖️ 减法 vs 加法</h4>
<div class="vs">
  <div class="side bad"><b>❌ 减法</b><span>砍男性流量 → 掉量 · 越砍越糟</span></div>
  <div class="mid">VS</div>
  <div class="side good"><b>➕ 加法</b><span>新增女性入口 · 结构自己变好</span></div>
</div></div>
<div class="sec"><h4>➕ 加法四步 · 由软到硬</h4>
<div class="box"><table>
<tr><th>力度</th><th>动作</th><th>原理</th></tr>
<tr><td>🪶 最软</td><td>换女性向素材（女性视角文案/出镜/痛点场景）</td><td>只动素材不动定向，内容变了吸引的人自然变</td></tr>
<tr><td>🪶🪶</td><td>新增女性定向计划（保留原计划，出价预算给足）</td><td>系统专门探索女性人群，原量一分不掉</td></tr>
<tr><td>🪶🪶🪶</td><td>喂数据：优化女性向落地页+回传正常跑</td><td>模型学到「女性=转化好」自动倾斜，最治本</td></tr>
<tr><td>🪨 慎用</td><td>叠加女性相关兴趣/行为标签</td><td>尽量不「排除男性」——减法且易误伤流量</td></tr>
</table></div></div>
<div class="sec"><h4>⚠️ 三个注意事项</h4>
<div class="box"><ul class="points">
<li>别急着动：先让模型积累 2-3 天转化数据</li>
<li>一次只动一个变量：先换素材，再建新计划</li>
<li>用数据说话：观察一周占比和成本再决定下一步</li>
</ul></div></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
核心解法「<b>加菜不撤菜</b>」：换女性向素材（最软）→ 新增女性定向计划 → 落地页+回传喂数据。<b>让模型通过转化数据自己把天平扳回来，而不是人工一刀切</b>。</div></div>`},

{n:10,ico:"👩",title:"女性广告",tag:"三层一致",glow:"linear-gradient(135deg,#ff6ec744,#ffa8e033)",body:`
<div class="sec"><h4>💗 三大心理特征（思考底层）</h4>
<div class="box formula"><span class="f-item">💗 感性决策<small style="display:block;font-weight:400;font-size:11px">先种草后比价</small></span>＋<span class="f-item">🔍 细节敏感</span>＋<span class="f-item">📢 分享传播</span></div>
<p class="tip">思考顺序：先懂人（用户层）→ 再懂内容（素材层）→ 最后懂钩子（标题层），三层必须一致。</p></div>
<div class="sec"><h4>👥 用户层 · 四类人群画像</h4>
<div class="box"><table>
<tr><th>人群</th><th>核心诉求</th><th>关键词</th></tr>
<tr><td>🎀 年轻（18-25）</td><td>颜值、性价比、追新</td><td>好看、便宜、潮流</td></tr>
<tr><td>💼 职场（25-35）</td><td>品质、效率、精致</td><td>质感、省心、高级感</td></tr>
<tr><td>👶 宝妈（28-45）</td><td>实用、安全、省心</td><td>环保、耐用、性价比</td></tr>
<tr><td>👑 成熟（40+）</td><td>品质、健康、家庭</td><td>信任、服务、面子</td></tr>
</table>
<p class="tip">三大深层诉求：<b>被理解</b>（痛点共鸣）·<b>变更好</b>（向往的生活）·<b>可分享</b>（社交货币）。决策路径：感性种草→理性比价→口碑确认→下单，真实反馈比自夸管用一百倍。</p></div></div>
<div class="sec"><h4>🎨 素材层 · 四要素</h4>
<div class="box flow">
<span class="step">🎨 好看<small>3秒定去留</small></span><span class="arr">·</span>
<span class="step">🏠 代入<small>真实场景</small></span><span class="arr">·</span>
<span class="step">💗 共鸣<small>情绪>功能</small></span><span class="arr">·</span>
<span class="step">✅ 真实<small>信任底线</small></span>
</div></div>
<div class="sec"><h4>🪝 标题层 · 五钩两禁</h4>
<div class="box"><table>
<tr><th>钩子类型</th><th>示例</th></tr>
<tr><td>💔 痛点共鸣</td><td>「结婚后才发现，会挑家的女人才是赢家」</td></tr>
<tr><td>✨ 向往型</td><td>「把家装成杂志封面，是什么体验？」</td></tr>
<tr><td>🪪 身份认同</td><td>「90后女孩的第一套房，必须装成理想型」</td></tr>
<tr><td>💰 利益钩子</td><td>「同样的预算，别人装出两倍效果」</td></tr>
<tr><td>🔮 悬念/干货</td><td>「装修师傅不会告诉你的3个秘密」</td></tr>
</table>
<p class="tip">🚫 两大禁忌：爹味说教（反感被教育）、虚假夸大（「全网第一」直接劝退）。</p></div></div>
<div class="sec"><h4>🔗 三层一致（最大加分点）</h4>
<div class="box flow">
<span class="step">🪝 标题<small>90后女孩</small></span><span class="arr">=</span>
<span class="step">🎬 素材<small>她出镜</small></span><span class="arr">=</span>
<span class="step">📄 落地页<small>她的家</small></span>
</div><p class="tip">三层割裂 = 点击率骗进来，转化率全跑光。用 A/B 测试反验人群定向。</p></div>
<div class="sec"><div class="recite"><div class="rt">⭐ 面试加分总结</div>
抓住<b>感性决策、细节敏感、分享传播</b>；用户层分层抓诉求，素材层「好看·代入·共鸣·真实」，标题层用痛点/身份/利益钩子、拒绝爹味和夸大；<b>标题=素材=落地页，三层一致</b>。</div></div>`}
];

/* ================= 渲染 ================= */
const grid=document.getElementById("grid");
TOPICS.forEach((t,i)=>{
  const c=document.createElement("div");
  c.className="card";c.style.setProperty("--glow",t.glow);
  c.style.animationDelay=(i*0.06)+"s";
  c.innerHTML=`<span class="num">${String(t.n).padStart(2,"0")}</span>
    <div class="ico">${t.ico}</div><h3>${t.title}</h3><span class="tag">${t.tag}</span>`;
  c.onclick=()=>openModal(i);
  grid.appendChild(c);
});

/* ================= 弹窗（统一大小） ================= */
const overlay=document.getElementById("overlay"),
      mHead=document.getElementById("mHead"),
      mBody=document.getElementById("mBody"),
      mIndex=document.getElementById("mIndex");
let cur=0;
function openModal(i){
  cur=(i+TOPICS.length)%TOPICS.length;
  const t=TOPICS[cur];
  mHead.style.setProperty("--glow",t.glow);
  mHead.innerHTML=`<div class="ico">${t.ico}</div>
    <div><h2>第${t.n}题 · ${t.title}</h2><div class="m-sub">${t.tag} · 点击「可背诵总结」可用于面试收尾</div></div>
    <button class="m-close" onclick="closeModal()">✕</button>`;
  mBody.innerHTML=t.body;
  mBody.scrollTop=0;
  mIndex.textContent=`${t.n} / ${TOPICS.length}`;
  overlay.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeModal(){overlay.classList.remove("show");document.body.style.overflow="";}
document.getElementById("prevBtn").onclick=()=>openModal(cur-1);
document.getElementById("nextBtn").onclick=()=>openModal(cur+1);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
document.addEventListener("keydown",e=>{
  if(!overlay.classList.contains("show"))return;
  if(e.key==="Escape")closeModal();
  if(e.key==="ArrowLeft")openModal(cur-1);
  if(e.key==="ArrowRight")openModal(cur+1);
});

/* ================= 主题切换 ================= */
const themeBtn=document.getElementById("themeBtn");
themeBtn.onclick=()=>{
  const html=document.documentElement;
  const dark=html.dataset.theme==="dark";
  html.dataset.theme=dark?"light":"dark";
  themeBtn.textContent=dark?"☀️":"🌙";
};
</script>
</body>
</html>
