            "Long|长","Short|短","Tall|高","Short (vs tall)|矮","Wide|宽","Narrow|窄","Big|大","Large|大","Small|小","Little|小","Slow|慢","Fast|快","Hot|热","Cold|冷","Warm|温","Cool|凉爽","New|新","Old|旧","Young|年轻","Old (vs young)|老","Good|好","Bad|坏","Wet|湿","Dry|干","Sick|病","Healthy|健康","Loud|响亮","Quiet|安静","Happy|开心","Sad|伤心","Beautiful|美丽","Ugly|丑陋","Deaf|聋哑","Blind|失明","Nice|友好","Mean|刻薄","Rich|富有","Poor|贫穷","Thick|厚","Thin|薄","Expensive|昂贵","Cheap|便宜","Flat|平","Curved|弯曲","Male|雄","Female|雌","Tight|紧","Loose|松","High|高","Low|低","Soft|软","Hard|硬","Deep|深","Shallow|浅","Clean|干净","Dirty|肮脏","Strong|强大","Weak|软弱","Dead|死","Alive|活","Heavy|重","Light|轻","Dark|暗","Light (bright)|亮","Nuclear|核能","Famous|著名"
        ]
    };

    // 统计总单词数
    let totalWords = 0;
    for (let cat in wordsData) {
        totalWords += wordsData[cat].length;
    }

    // 渲染函数 (支持搜索高亮)
    let currentSearchTerm = "";

    function highlightText(text, term) {
        if (!term.trim()) return text;
        const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, `<mark class="highlight">$1</mark>`);
    }

    function renderCategories(filterTerm = "") {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        let visibleWordCount = 0;

        for (let [category, words] of Object.entries(wordsData)) {
            // 过滤单词
            let filteredWords = words;
            if (filterTerm.trim() !== "") {
                const termLower = filterTerm.toLowerCase();
                filteredWords = words.filter(pair => {
                    const [en, zh] = pair.split('|');
                    return en.toLowerCase().includes(termLower) || zh.toLowerCase().includes(termLower);
                });
            }
            if (filteredWords.length === 0 && filterTerm) continue; // 无匹配不显示分类区块

            visibleWordCount += filteredWords.length;

            // 构建卡片html
            const cardDiv = document.createElement('div');
            cardDiv.className = 'category-card';
            const categoryId = `cat-${category.replace(/\s/g, '')}`;
            // 是否默认展开：没有搜索词时全部展开；搜索词时自动展开所有匹配分类以便查找
            const defaultOpen = (filterTerm.trim() !== "") ? true : true;  // 初始全部展开更友好，但用户可以折叠
            const contentDisplay = defaultOpen ? 'grid' : 'none';
            const iconRotate = defaultOpen ? 'rotate(0deg)' : 'rotate(-90deg)';

            let wordsHtml = '';
            filteredWords.forEach(pair => {
                let [en, zh] = pair.split('|');
                let displayEn = filterTerm ? highlightText(en, filterTerm) : en;
                let displayZh = filterTerm ? highlightText(zh, filterTerm) : zh;
                wordsHtml += `
                    <div class="word-card">
                        <div class="word-en">${displayEn}</div>
                        <div class="word-zh">${displayZh}</div>
                    </div>
                `;
            });
            if (filteredWords.length === 0) {
                wordsHtml = '<div class="no-match">✨ 没有匹配的单词，试试其他词 ✨</div>';
            }

            cardDiv.innerHTML = `
                <div class="category-header" data-cat="${categoryId}">
                    <div class="category-title">
                        <i class="fas ${getIconForCategory(category)}"></i>
                        <span>${category}</span>
                        <span class="badge-count">${filteredWords.length}</span>
                    </div>
                    <i class="fas fa-chevron-down toggle-icon" style="transform: ${iconRotate};"></i>
                </div>
                <div class="category-content" id="${categoryId}" style="display: ${contentDisplay};">
                    ${wordsHtml}
                </div>
            `;
            container.appendChild(cardDiv);
        }

        document.getElementById('statsDisplay').innerHTML = `📚 当前显示 ${visibleWordCount} / ${totalWords} 个核心词 &nbsp;|&nbsp; 🎯 轻松记忆`;
        
        // 绑定折叠事件
        document.querySelectorAll('.category-header').forEach(header => {
            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const contentId = header.getAttribute('data-cat');
                const contentDiv = document.getElementById(contentId);
                const icon = header.querySelector('.toggle-icon');
                if (contentDiv.style.display === 'none' || getComputedStyle(contentDiv).display === 'none') {
                    contentDiv.style.display = 'grid';
                    icon.style.transform = 'rotate(0deg)';
                } else {
                    contentDiv.style.display = 'none';
                    icon.style.transform = 'rotate(-90deg)';
                }
            });
        });
    }

    function getIconForCategory(catName) {
        if (catName.includes('动物')) return 'fa-paw';
        if (catName.includes('交通')) return 'fa-car';
        if (catName.includes('地点')) return 'fa-location-dot';
        if (catName.includes('服装')) return 'fa-shirt';
        if (catName.includes('颜色')) return 'fa-palette';
        if (catName.includes('人物')) return 'fa-users';
        if (catName.includes('工作')) return 'fa-briefcase';
        if (catName.includes('社会')) return 'fa-globe';
        if (catName.includes('艺术')) return 'fa-music';
        if (catName.includes('饮料')) return 'fa-mug-hot';
        if (catName.includes('食物')) return 'fa-utensils';
        if (catName.includes('家内')) return 'fa-house';
        if (catName.includes('电子')) return 'fa-mobile-alt';
        if (catName.includes('大自然')) return 'fa-leaf';
        if (catName.includes('材料')) return 'fa-cube';
        if (catName.includes('数学')) return 'fa-calculator';
        if (catName.includes('其他名词')) return 'fa-tag';
        if (catName.includes('方向')) return 'fa-compass';
        if (catName.includes('季节')) return 'fa-cloud-sun';
        if (catName.includes('数字')) return 'fa-hashtag';
        if (catName.includes('月份')) return 'fa-calendar-alt';
        if (catName.includes('星期')) return 'fa-calendar-week';
        if (catName.includes('时间')) return 'fa-clock';
        if (catName.includes('动词')) return 'fa-running';
        if (catName.includes('形容词')) return 'fa-smile';
        return 'fa-bookmark';
    }

    // 搜索功能
    const searchInput = document.getElementById('searchInput');
    function handleSearch() {
        currentSearchTerm = searchInput.value.trim();
        renderCategories(currentSearchTerm);
    }
    searchInput.addEventListener('input', handleSearch);
    
    // 全部展开/折叠
    function expandAll() {
        document.querySelectorAll('.category-content').forEach(content => {
            content.style.display = 'grid';
        });
        document.querySelectorAll('.toggle-icon').forEach(icon => {
            icon.style.transform = 'rotate(0deg)';
        });
    }
    function collapseAll() {
        document.querySelectorAll('.category-content').forEach(content => {
            content.style.display = 'none';
        });
        document.querySelectorAll('.toggle-icon').forEach(icon => {
            icon.style.transform = 'rotate(-90deg)';
        });
    }
    document.getElementById('expandAllBtn').addEventListener('click', expandAll);
    document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);

    // 初始渲染
    renderCategories("");
</script>
</body>
</html>
